name: 🌐 Deploy web terminal

# Publishes terminal/ to GitHub Pages:
#   https://phimaii.github.io/PhiMaii/                       demo page
#   https://phimaii.github.io/PhiMaii/phimaii-terminal.js    script to embed

on:
  push:
    branches: [main]
    paths:
      - "terminal/**"
      - "card/art.js"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync portrait from card/art.js
        run: node terminal/sync-art.js

      - name: Check the script parses
        run: node --check terminal/phimaii-terminal.js

      - name: Build site folder
        run: |
          mkdir -p _site
          cp terminal/index.html terminal/phimaii-terminal.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
