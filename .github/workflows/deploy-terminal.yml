name: 🌐 Deploy web terminal

# Publishes terminal/ to GitHub Pages:
#   https://phimaii.github.io/PhiMaii/                       demo page
#   https://phimaii.github.io/PhiMaii/phimaii-terminal.js    script to embed
#   https://phimaii.github.io/PhiMaii/card.svg               animated SVG for the profile README
#   https://phimaii.github.io/PhiMaii/projects/<id>.svg      project cards for the profile README
# Runs daily too, so the GitHub stats baked into card.svg stay fresh.

on:
  push:
    branches: [main]
    paths:
      - "terminal/**"
      - "card/art.js"
      - ".github/workflows/deploy-terminal.yml"
  schedule:
    - cron: "17 4 * * *" # daily, ~05:17 in Zürich
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs (GitHub's recommended setup): deploying in the same job
# right after the upload sometimes fails with "No artifacts named github-pages were found",
# because the artifact isn't registered yet. The deploy job also retries once.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync portrait from card/art.js
        run: node terminal/sync-art.js

      - name: Check the script parses
        run: node --check terminal/phimaii-terminal.js

      - name: Build site folder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp terminal/index.html terminal/phimaii-terminal.js _site/
          node terminal/render-svg.js _site/card.svg
          node terminal/render-projects.js _site/projects
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
